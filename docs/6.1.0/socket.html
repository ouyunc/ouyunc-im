<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>测试websocket</title>
	<link rel="icon" href="data:image/ico;base64,aWNv">

</head>



<script src="google-protobuf.js"></script>
<script src="ouyunc-protobuf-message.js"></script>
<script type="module">
import Socket from './ouyunc-sdk.js';
// 默认配置文件，可以进行覆盖
let defaultConfig = {
        clientType: 1, // 1-web, 2-uniapp
        Message: null, // protobuf Message 对象
        deviceType: 0,
        networkType: 0,
        encryptType: 0,
        serializeAlgorithm: 6, // 6-protobuf, 2-json
        heartbeat: {
            enable: true,
            maxWait: 3,
            interval: 10000,
            timeout: 5000
        },
        reconnect: {
            enable: true,
            maxTimes: -1,
            delay: 2000
        }
    };
const socket = new Socket('ws://192.168.0.108:6003/ws', {
    clientType: 1,
    // 2-json序列化，6-protocolbuf 序列化，需要引入两个protobuf文件，且 属性 Message: proto.com.ouyunc.base.packet.message.Message,需要配置
	serializeAlgorithm: 2,
	Message: proto.com.ouyunc.base.packet.message.Message,
    heartbeat: {
        enable: true,
        interval: 5000
    }
});
socket.onopen = (e) => {
	let packet = socket.send({
            // 登录消息类型，
            messageType: 11,
            // 消息
            message: {
                // 消息发送方唯一标识，建议使用用户id
                from: '18888888888',
                // 消息接收方唯一标识，这里是登录，接受者是服务器，值可以为空串
                to: '',
                // 消息内容类型
                contentType: 10,
                // 消息内容content 是string 类型
                content: JSON.stringify({
                    identity: '18888888888',
                    appKey: 'ouyunc',
                    signatureAlgorithm: 1,//md5
                    signature: '123456',
                    createTime: new Date().getTime()
                })
            }
        });
	console.log(packet)
};
socket.onmessage = ({
                        messageId,
                        messageType,
                        message
                    }) => {
    console.log('messageId:', messageId);
	console.log('messageType:', messageType);
	console.log('message:', message);
};















</script>
<body>

    <form onsubmit="return false">

        <textarea  id="responseMessage" style="height: 300px; width: 100px"></textarea>
        <input type="button" onclick="document.getElementById('responseMessage').value = ''" value="清空内容"/>
        <textarea id="sendMessage" name="sendMessage" style="height: 300px; width: 100px"></textarea>
        <input type="button" onclick="send(this.form.sendMessage.value)" value="发送消息" />


        <input type="text" name="add" />
        <input type="button" onclick="addFriend(this.form.add.value)" value="添加好友" />

    </form>


</body>
</html>
