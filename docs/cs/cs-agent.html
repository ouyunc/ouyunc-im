<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客服坐席工作台 · Mock</title>
  <link rel="icon" href="data:image/ico;base64,aWNv" />
  <style>
    :root {
      --primary: #1677ff;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --bg: #f0f2f5;
      --border: #e8e8e8;
      --text: #262626;
      --muted: #8c8c8c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      background: var(--bg); height: 100vh; overflow: hidden; color: var(--text);
    }
    .workbench { display: flex; flex-direction: column; height: 100%; }

    .topbar {
      height: 56px; background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0;
    }
    .topbar-logo { font-weight: 700; font-size: 16px; color: var(--primary); }
    .mock-badge { background: #fef3c7; color: #92400e; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .agent-info { font-size: 13px; color: var(--muted); }
    .stats { display: flex; gap: 20px; font-size: 13px; margin-left: 16px; }
    .stats strong { color: var(--primary); }
    .status-group { display: flex; gap: 8px; margin-left: auto; }
    .status-btn {
      padding: 6px 14px; border-radius: 16px; border: 1px solid var(--border);
      background: #fff; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .status-btn.active { border-color: var(--primary); background: #e6f4ff; color: var(--primary); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: var(--success); }
    .status-dot.away { background: var(--warning); }
    .status-dot.dnd { background: var(--danger); }
    .status-dot.offline { background: #bfbfbf; }
    .topbar-nav { display: flex; gap: 4px; margin-left: 8px; }
    .topbar-nav a {
      font-size: 12px; color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 4px;
    }
    .topbar-nav a:hover { color: var(--primary); background: #f5f5f5; }

    .qr-picker-wrap { position: relative; display: inline-block; }
    .qr-picker {
      position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; width: 320px; max-height: 240px;
      overflow-y: auto; background: #fff; border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 20;
    }
    .qr-picker.open { display: block; }
    .qr-picker-item {
      padding: 10px 14px; border-bottom: 1px solid #f5f5f5; cursor: pointer; font-size: 13px;
    }
    .qr-picker-item:hover { background: #f0f7ff; }
    .qr-picker-item-title { font-weight: 500; margin-bottom: 2px; }
    .qr-picker-item-sub { font-size: 11px; color: var(--muted); }

    .main { flex: 1; display: flex; min-height: 0; }

    .session-list { width: 280px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .session-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .session-tab {
      flex: 1; padding: 12px; text-align: center; font-size: 13px; cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    .session-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .session-tab .badge { background: var(--danger); color: #fff; font-size: 11px; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
    .session-items { flex: 1; overflow-y: auto; }
    .session-item { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
    .session-item:hover, .session-item.active { background: #e6f4ff; }
    .session-item-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .session-item-name { font-weight: 500; font-size: 14px; }
    .session-item-time { font-size: 11px; color: var(--muted); }
    .session-item-preview { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .session-unread {
      display: inline-block; min-width: 18px; padding: 0 6px; height: 18px; line-height: 18px;
      border-radius: 9px; background: var(--danger); color: #fff; font-size: 11px; text-align: center; margin-left: 6px;
    }
    .session-item-tag { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #fff7e6; color: #d48806; margin-top: 4px; }

    .chat-area { flex: 1; display: flex; flex-direction: column; background: #fafafa; min-width: 0; min-height: 0; position: relative; }
    .chat-content { flex: 1; display: none; flex-direction: column; min-height: 0; overflow: hidden; }
    .chat-content.is-open { display: flex; }
    .empty-chat.is-hidden { display: none !important; }
    .chat-header {
      padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    }
    .chat-header h2 { font-size: 16px; }
    .chat-header-sub { font-size: 12px; color: var(--muted); }
    .chat-actions { margin-left: auto; display: flex; gap: 8px; }
    .chat-actions button {
      padding: 6px 12px; border: 1px solid var(--border); background: #fff; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .chat-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .chat-actions button:disabled { opacity: .5; cursor: not-allowed; }

    .chat-toolbar {
      display: flex; gap: 8px; padding: 8px 20px; background: #fff;
      border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
    }
    .tool-btn {
      padding: 5px 12px; font-size: 12px; border: 1px solid var(--border); background: #fafafa;
      border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    }
    .tool-btn:hover { border-color: var(--primary); color: var(--primary); background: #e6f4ff; }
    .tool-btn .count { background: var(--danger); color: #fff; font-size: 10px; padding: 0 5px; border-radius: 8px; }

    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { display: flex; margin-bottom: 16px; gap: 10px; }
    .msg.out { flex-direction: row-reverse; }
    .msg.in { cursor: context-menu; }
    .msg-avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff;
    }
    .msg.out .msg-avatar { background: var(--primary); }
    .msg.in .msg-avatar { background: #87d068; }
    .msg-body { max-width: 60%; }
    .msg-meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .msg.out .msg-meta { text-align: right; }
    .msg-bubble { padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
    .msg.in .msg-bubble { background: #fff; border: 1px solid var(--border); }
    .msg.in .msg-bubble:hover { border-color: #91caff; }
    .msg.out .msg-bubble { background: var(--primary); color: #fff; }
    .msg-trans-block {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0,0,0,.12);
      font-size: 12px; line-height: 1.5;
    }
    .msg.out .msg-trans-block { border-top-color: rgba(255,255,255,.35); color: rgba(255,255,255,.92); }
    .msg-trans-label { font-size: 11px; opacity: .75; display: block; margin-bottom: 2px; }
    .msg-actions { margin-top: 4px; display: flex; gap: 6px; flex-wrap: wrap; }
    .msg.out .msg-actions { justify-content: flex-end; }
    .msg-tr-btn {
      padding: 2px 8px; font-size: 11px; border: 1px solid var(--border); background: #fff;
      border-radius: 4px; cursor: pointer; color: var(--muted);
    }
    .msg.out .msg-tr-btn { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.4); color: #fff; }
    .msg-tr-btn:hover { border-color: var(--primary); color: var(--primary); }

    .translate-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
      padding: 8px 20px; background: #f9fafb; border-top: 1px solid var(--border); flex-shrink: 0;
      font-size: 12px;
    }
    .translate-bar label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
    .translate-bar select {
      padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12px; background: #fff;
    }
    .translate-bar .chk { color: var(--text); }

    .compose-preview {
      padding: 10px 20px; background: #fffbe6; border-top: 1px solid #ffe58f; flex-shrink: 0;
    }
    .compose-preview-label { font-size: 11px; color: #ad8b00; margin-bottom: 4px; }
    .compose-preview-text { font-size: 14px; line-height: 1.5; color: var(--text); min-height: 20px; }
    .compose-preview.is-empty { display: none; }

    .chat-input-wrap { border-top: 1px solid var(--border); background: #fff; flex-shrink: 0; }
    .chat-input {
      padding: 12px 20px 8px; display: flex; gap: 10px;
    }
    .chat-input-actions {
      padding: 0 20px 12px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
    }
    .chat-input-actions button {
      padding: 6px 14px; border-radius: 6px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: #fff;
    }
    .chat-input-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .chat-input-actions button.ghost { color: var(--muted); }
    .chat-input textarea {
      flex: 1; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; font-size: 14px; resize: none; height: 72px; font-family: inherit;
    }
    .chat-input button {
      align-self: flex-end; padding: 10px 24px; background: var(--primary);
      color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px;
    }

    /* 右侧上下文面板 */
    .context-panel {
      width: 340px; background: #fff; border-left: 1px solid var(--border);
      display: none; flex-direction: column; flex-shrink: 0; min-height: 0;
    }
    .context-panel.show { display: flex; }
    .ctx-tabs { display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .ctx-tab {
      flex: 1; padding: 10px 4px; text-align: center; font-size: 13px; cursor: pointer;
      border-bottom: 2px solid transparent; color: var(--muted);
    }
    .ctx-tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
    .ctx-body { flex: 1; overflow-y: auto; padding: 16px; min-height: 0; }
    .ctx-pane { display: none; }
    .ctx-pane.active { display: block; }

    .info-row { margin-bottom: 12px; font-size: 13px; }
    .info-row label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 2px; }
    .info-row span { word-break: break-all; }
    .consult-card {
      background: #f6ffed; border: 1px solid #b7eb8f; border-radius: 8px; padding: 12px; margin: 12px 0;
      font-size: 13px; line-height: 1.6;
    }
    .consult-card.status-closed { background: #fafafa; border-color: var(--border); }
    .consult-card.status-transferred { background: #fff7e6; border-color: #ffd591; }
    .consult-card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .consult-card-head strong { font-size: 14px; }
    .status-badge {
      font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600;
    }
    .status-badge.processing { background: #f6ffed; color: var(--success); border: 1px solid #b7eb8f; }
    .status-badge.closed { background: #f5f5f5; color: var(--muted); border: 1px solid var(--border); }
    .status-badge.transferred { background: #fff7e6; color: #d48806; border: 1px solid #ffd591; }
    .consult-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .meta-chip {
      font-size: 11px; padding: 2px 8px; border-radius: 4px; background: #f0f0f0; color: #595959;
    }
    .meta-chip.warn { background: #fff2e8; color: #d4380d; }
    .meta-chip.info { background: #e6f4ff; color: var(--primary); }

    .flow-timeline { margin-bottom: 8px; }
    .flow-item {
      position: relative; padding: 0 0 12px 14px; border-left: 2px solid var(--border);
      margin-left: 4px; font-size: 12px;
    }
    .flow-item:last-child { padding-bottom: 0; border-left-color: transparent; }
    .flow-item::before {
      content: ''; position: absolute; left: -5px; top: 4px; width: 8px; height: 8px;
      border-radius: 50%; background: var(--primary); border: 2px solid #fff;
    }
    .flow-item.type-transfer::before { background: var(--warning); }
    .flow-item.type-close::before { background: var(--muted); }
    .flow-time { color: var(--muted); font-size: 11px; }
    .flow-title { font-weight: 600; color: var(--text); margin: 2px 0; font-size: 13px; }
    .flow-desc { color: var(--muted); line-height: 1.5; }

    .history-list { margin-top: 4px; }
    .history-item {
      border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden;
    }
    .history-item-head {
      padding: 10px 12px; cursor: pointer; background: #fafafa; font-size: 13px;
    }
    .history-item-head:hover { background: #f0f5ff; }
    .history-item-title { font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
    .history-item-sub { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
    .history-item-body {
      display: none; padding: 10px 12px 12px; border-top: 1px solid var(--border); font-size: 12px;
      background: #fff;
    }
    .history-item.expanded .history-item-body { display: block; }
    .history-expand-hint { font-size: 11px; color: var(--primary); margin-top: 4px; }

    .section-title { font-size: 13px; font-weight: 600; margin: 16px 0 8px; color: var(--text); }
    .section-title:first-child { margin-top: 0; }
    .wo-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px;
    }
    .wo-card-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .wo-card-id { font-weight: 600; font-size: 12px; color: var(--primary); }
    .wo-status { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #e6f4ff; color: var(--primary); }
    .wo-status.done { background: #f6ffed; color: var(--success); }
    .wo-card-desc { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .btn-block {
      width: 100%; padding: 10px; margin-top: 12px; background: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
    }
    .btn-block:hover { background: #0958d9; }
    .empty-hint { text-align: center; color: var(--muted); font-size: 13px; padding: 24px 8px; }

    .search-box { display: flex; gap: 8px; margin-bottom: 12px; }
    .search-box input {
      flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px;
    }
    .search-box button {
      padding: 8px 14px; background: var(--primary); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 13px;
    }
    .mat-group { margin-bottom: 16px; }
    .mat-group-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 4px; }
    .mat-item {
      border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 13px;
    }
    .mat-item-title { font-weight: 500; margin-bottom: 4px; }
    .mat-item-snippet { font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 8px; }
    .mat-item-actions { display: flex; gap: 6px; }
    .mat-item-actions button {
      padding: 3px 10px; font-size: 11px; border: 1px solid var(--border); background: #fff;
      border-radius: 4px; cursor: pointer;
    }
    .mat-item-actions button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* 工单抽屉 */
    .drawer-mask {
      position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 200;
      display: none; align-items: stretch; justify-content: flex-end;
    }
    .drawer-mask.open { display: flex; }
    .drawer {
      width: 420px; max-width: 100vw; background: #fff; height: 100%;
      display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,.12);
    }
    .drawer-header {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .drawer-header h3 { font-size: 16px; }
    .drawer-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--muted); }
    .drawer-body { flex: 1; overflow-y: auto; padding: 20px; }
    .form-field { margin-bottom: 16px; }
    .form-field label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text); }
    .form-field input, .form-field select, .form-field textarea {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; font-family: inherit;
    }
    .form-field textarea { min-height: 100px; resize: vertical; }
    .form-meta { font-size: 12px; color: var(--muted); background: #fafafa; padding: 10px; border-radius: 8px; margin-bottom: 16px; line-height: 1.6; }
    .drawer-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .drawer-footer button {
      padding: 8px 20px; border-radius: 8px; font-size: 14px; cursor: pointer; border: 1px solid var(--border); background: #fff;
    }
    .drawer-footer button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }

    .empty-chat {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 14px; flex-direction: column; gap: 8px;
    }
    .empty-chat small { font-size: 12px; }

    .ctx-msg-menu {
      position: fixed; z-index: 150; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); padding: 4px 0; display: none; min-width: 140px;
    }
    .ctx-msg-menu.show { display: block; }
    .ctx-msg-menu button {
      display: block; width: 100%; text-align: left; padding: 8px 16px; border: none; background: none;
      font-size: 13px; cursor: pointer;
    }
    .ctx-msg-menu button:hover { background: #f5f5f5; }

    .api-log {
      position: fixed; left: 16px; bottom: 16px; width: 360px; max-height: 140px;
      overflow-y: auto; background: #111827; color: #93c5fd; padding: 10px;
      border-radius: 8px; font-family: ui-monospace, monospace; font-size: 10px;
      line-height: 1.5; z-index: 100; opacity: .92;
    }
    .api-log-toggle {
      position: fixed; left: 16px; bottom: 16px; z-index: 101;
      padding: 6px 10px; font-size: 11px; border-radius: 6px;
      border: 1px solid var(--border); background: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="workbench">
    <header class="topbar">
      <div class="topbar-logo">偶遇云 · 客服工作台</div>
      <span class="mock-badge">MOCK API</span>
      <nav class="topbar-nav">
        <a href="cs-lobby.html">大厅</a>
        <a href="cs-tickets.html">咨询单</a>
        <a href="cs-admin-settings.html">系统配置</a>
        <a href="cs-profile.html">个人设置</a>
      </nav>
      <div class="agent-info" id="agentInfo">坐席一 · NO001 · agent-001</div>
      <div class="stats">
        <span>进行中 <strong id="statActive">0</strong>/<strong id="statMaxActive">—</strong></span>
        <span>托管 <strong id="statHosted">0</strong>/<strong id="statMaxHosted">—</strong></span>
        <span>排队 <strong id="statQueue">0</strong></span>
      </div>
      <div class="status-group">
        <button class="status-btn nav-btn" id="backLobbyBtn" title="签出并返回大厅">返回大厅</button>
        <button class="status-btn active" data-status="online"><span class="status-dot online"></span>在线</button>
        <button class="status-btn" data-status="away"><span class="status-dot away"></span>暂离</button>
        <button class="status-btn" data-status="dnd"><span class="status-dot dnd"></span>勿扰</button>
        <button class="status-btn" data-status="offline"><span class="status-dot offline"></span>离线</button>
      </div>
    </header>

    <div class="main">
      <aside class="session-list">
        <div class="session-tabs">
          <div class="session-tab active" data-tab="active">进行中<span class="badge" id="badgeActive">0</span></div>
          <div class="session-tab" data-tab="hosted">托管中<span class="badge" id="badgeHosted">0</span></div>
          <div class="session-tab" data-tab="pendingResume">待恢复<span class="badge" id="badgePending">0</span></div>
          <div class="session-tab" data-tab="queue">进线队列<span class="badge" id="badgeQueue">0</span></div>
        </div>
        <div class="session-items" id="sessionItems"></div>
      </aside>

      <section class="chat-area" id="chatArea">
        <div class="empty-chat" id="emptyChat">
          <div>选择左侧会话开始接待</div>
          <small>右侧面板：客户 · 工单 · 资料</small>
        </div>
        <div id="chatContent" class="chat-content">
          <div class="chat-header">
            <div>
              <h2 id="chatTitle">—</h2>
              <div class="chat-header-sub" id="chatSub">—</div>
            </div>
            <div class="chat-actions">
              <button disabled title="二期">转接</button>
              <button id="suspendBtn" title="挂起托管，释放进行中槽位">挂起托管</button>
              <button id="resumeBtn" title="恢复托管会话" style="display:none">恢复接待</button>

          </div>
          <div class="chat-toolbar">
            <button class="tool-btn" id="toolSearchBtn">🔍 查资料</button>
            <button class="tool-btn" id="toolCreateWoBtn">📋 建工单</button>
            <button class="tool-btn" id="toolWoListBtn">📎 历史工单 <span class="count" id="woCountBadge" style="display:none">0</span></button>

          <div class="translate-bar">

                <option value="ja">日本語</option>
                <option value="ko">한국어</option>

            <label>客户语言
              <select id="customerLang">
                <option value="zh">中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
              </select>

            <label class="chk"><input type="checkbox" id="autoTranslateIn" checked /> 入站自动译</label>
            <label class="chk"><input type="checkbox" id="autoTranslateOut" checked /> 发送前翻译</label>
          </div>

          <div class="compose-preview is-empty" id="composePreview">
            <div class="compose-preview-label">客户将收到 · <span id="previewLangLabel">—</span></div>
            <div class="compose-preview-text" id="composePreviewText">—</div>
          </div>

          <div class="chat-input-wrap">
            <div class="chat-input">
              <textarea id="agentInput" placeholder="用坐席语言输入，发送前可自动译为客户的语言…"></textarea>
              <button id="agentSendBtn" title="按当前设置发送（默认发送译文）">发送</button>
            </div>
            <div class="chat-input-actions">
              <div class="qr-picker-wrap">
                <button class="ghost" id="quickReplyBtn">常用语</button>
                <div class="qr-picker" id="qrPicker"></div>
              </div>
              <button class="ghost" id="previewTranslateBtn">预览翻译</button>
              <button class="primary" id="sendTranslatedBtn">发送译文</button>
              <button id="sendOriginalBtn">发送原文</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="context-panel" id="contextPanel">
        <div class="ctx-tabs">
          <div class="ctx-tab active" data-ctx="customer">客户</div>
          <div class="ctx-tab" data-ctx="workorder">工单</div>
          <div class="ctx-tab" data-ctx="materials">资料</div>
        </div>
        <div class="ctx-body">
          <!-- 客户 Tab -->
          <div class="ctx-pane active" id="paneCustomer">
            <div class="info-row"><label>客户 ID</label><span id="cId">—</span></div>
            <div class="info-row"><label>客户语言</label><span id="cLocale">—</span></div>
            <div class="info-row"><label>进线渠道</label><span id="cChannel">—</span></div>
            <div class="info-row"><label>咨询类型</label><span id="cSkill">—</span></div>

            <div class="section-title" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center">
              <span>当前咨询 · 处理情况</span>
              <a href="cs-tickets.html" id="viewTicketLink" style="font-size:12px;font-weight:normal" title="在咨询单中心查看完整流转与聊天">详情 ↗</a>
            </div>
            <div class="consult-card" id="currentTicketCard">
              <div class="empty-hint" style="padding:12px">选择会话后加载…</div>
            </div>
            <div class="info-row"><label>会话 ID</label><span id="cSession" style="font-size:11px;font-family:monospace;">—</span></div>

            <div class="section-title">本次转接 / 流转</div>
            <div id="currentTimeline" class="flow-timeline"><div class="empty-hint">—</div></div>

            <div class="section-title">历史进线 <span id="historyCount" style="font-weight:normal;color:var(--muted)">(0)</span></div>
            <div id="historyList" class="history-list"><div class="empty-hint">暂无历史进线</div></div>
          </div>
          <!-- 工单 Tab -->
          <div class="ctx-pane" id="paneWorkorder">
            <div class="section-title">本咨询单关联工单</div>
            <div id="woListContainer"><div class="empty-hint">加载中…</div></div>
            <button class="btn-block" id="paneCreateWoBtn">+ 新建工单</button>
          </div>
          <!-- 资料 Tab -->
          <div class="ctx-pane" id="paneMaterials">
            <div class="search-box">
              <input type="text" id="matSearchInput" placeholder="搜索知识库、订单、文档…" />
              <button id="matSearchBtn">搜索</button>
            </div>
            <div id="matResults"><div class="empty-hint">输入关键词搜索，或留空浏览推荐</div></div>
          </div>
        </div>

  </div>

  <!-- 消息右键菜单 -->
  <div class="ctx-msg-menu" id="msgContextMenu">
    <button data-action="quote-wo">引用建单</button>
    <button data-action="search-mat">按此搜索资料</button>
    <button data-action="translate-msg">翻译此消息</button>
  </div>

  <!-- 新建工单抽屉 -->
  <div class="drawer-mask" id="woDrawerMask">
    <div class="drawer" role="dialog" aria-label="新建工单">
      <div class="drawer-header">
        <h3>新建工单</h3>
        <button class="drawer-close" id="woDrawerClose">×</button>
      </div>
      <div class="drawer-body">
        <div class="form-meta" id="woFormMeta">—</div>
        <div class="form-field">
          <label>工单类型</label>
          <select id="woType">
            <option value="GENERAL">通用</option>
            <option value="REFUND">售后退款</option>
            <option value="TECH_SUPPORT">技术支持</option>
            <option value="BILLING">发票账务</option>
          </select>
        </div>
        <div class="form-field">
          <label>标题</label>
          <input type="text" id="woTitle" placeholder="简要描述问题" maxlength="80" />
        </div>
        <div class="form-field">
          <label>详细描述</label>
          <textarea id="woDesc" placeholder="可引用客户原话或补充内部备注"></textarea>
        </div>
        <div class="form-field">
          <label>优先级</label>
          <select id="woPriority">
            <option value="low">低</option>
            <option value="medium" selected>中</option>
            <option value="high">高</option>
          </select>
        </div>
      </div>
      <div class="drawer-footer">
        <button id="woCancelBtn">取消</button>
        <button class="primary" id="woSubmitBtn">创建工单</button>
      </div>
    </div>
  </div>

  <button class="api-log-toggle" id="logToggle">API 日志</button>
  <div class="api-log" id="apiLog" style="display:none;"></div>

  <script src="mock-api.js"></script>
  <script>
    const api = window.CsMockApi;
    const AGENT_ID = 'agent-001';
    const DEVICE_TYPE = api.DEFAULT_DEVICE_TYPE != null ? api.DEFAULT_DEVICE_TYPE : 0;

    let currentTab = 'active';
    let currentSession = null;
    let currentCtxTab = 'customer';
    let quotedMessageText = '';
    let msgMenuTarget = null;
    /** @type {{knowledge:Array,orders:Array,docs:Array}} */
    let lastMaterialResults = { knowledge: [], orders: [], docs: [] };
    let composePreviewTimer = null;
    let lastComposePreview = '';

    function getAgentLang() {
      return api.normalizeLang(document.getElementById('agentLang').value);
    }

    function getCustomerLang() {
      return api.normalizeLang(document.getElementById('customerLang').value);
    }

    function isAutoTranslateIn() {
      return document.getElementById('autoTranslateIn').checked;
    }

    function isAutoTranslateOut() {
      return document.getElementById('autoTranslateOut').checked;
    }

    function saveLangPrefs() {
      try {
        localStorage.setItem('cs-agent-lang', JSON.stringify({
          agentLang: getAgentLang(),
          autoTranslateIn: isAutoTranslateIn(),
          autoTranslateOut: isAutoTranslateOut(),
        }));
      } catch (_) {}
    }

    function loadLangPrefs() {
      try {
        const raw = localStorage.getItem('cs-agent-lang');
        if (raw) {
          const p = JSON.parse(raw);
          if (p.agentLang) document.getElementById('agentLang').value = api.normalizeLang(p.agentLang);
          if (p.autoTranslateIn != null) document.getElementById('autoTranslateIn').checked = p.autoTranslateIn;
          if (p.autoTranslateOut != null) document.getElementById('autoTranslateOut').checked = p.autoTranslateOut;
        }
      } catch (_) {}
    }

    async function loadProfilePrefs() {
      try {
        const profile = await api.getAgentProfile(AGENT_ID);
        if (profile.agentLocale) document.getElementById('agentLang').value = api.normalizeLang(profile.agentLocale);
        if (profile.autoTranslateIn != null) document.getElementById('autoTranslateIn').checked = profile.autoTranslateIn;
        if (profile.autoTranslateOut != null) document.getElementById('autoTranslateOut').checked = profile.autoTranslateOut;
      } catch (_) {}
    }

    let quickRepliesCache = [];

    async function loadQuickRepliesForWorkbench() {
      try {
        const res = await api.listQuickReplies(AGENT_ID);
        quickRepliesCache = res.items || [];
        renderQrPicker();
      } catch (_) {
        quickRepliesCache = [];
      }
    }

    function renderQrPicker() {
      const el = document.getElementById('qrPicker');
      if (!quickRepliesCache.length) {
        el.innerHTML = '<div class="qr-picker-item" style="cursor:default;color:var(--muted)">暂无常用语，<a href="cs-profile.html#quick-replies">去添加</a></div>';
        return;
      }
      el.innerHTML = quickRepliesCache.map(function (q) {
        return '<div class="qr-picker-item" data-qr-id="' + q.id + '">' +
          '<div class="qr-picker-item-title">' + escapeHtml(q.title) +
          (q.shortcut ? ' <code style="font-size:10px">' + escapeHtml(q.shortcut) + '</code>' : '') + '</div>' +
          '<div class="qr-picker-item-sub">' + escapeHtml(q.content.slice(0, 48)) + (q.content.length > 48 ? '…' : '') + '</div></div>';
      }).join('');
      el.querySelectorAll('[data-qr-id]').forEach(function (item) {
        item.onclick = function () {
          const q = quickRepliesCache.find(function (x) { return x.id === item.dataset.qrId; });
          if (q) insertQuickReply(q.content);
          el.classList.remove('open');
        };
      });
    }

    function insertQuickReply(text) {
      const ta = document.getElementById('agentInput');
      const name = (api.getAgentInfo(AGENT_ID) || {}).agentName || '客服';
      const content = String(text).replace(/\{agentName\}/g, name);
      if (ta.value && !ta.value.endsWith('\n')) ta.value += '\n';
      ta.value += content;
      ta.focus();
      scheduleComposePreview();
    }

    function tryQuickReplyShortcut() {
      const ta = document.getElementById('agentInput');
      const lines = ta.value.split('\n');
      const last = lines[lines.length - 1].trim();
      if (!last.startsWith('/')) return false;
      const q = quickRepliesCache.find(function (x) { return x.shortcut === last; });
      if (!q) return false;
      lines[lines.length - 1] = q.content.replace(/\{agentName\}/g, (api.getAgentInfo(AGENT_ID) || {}).agentName || '客服');
      ta.value = lines.join('\n');
      scheduleComposePreview();
      return true;
    }

    function translationTargetForMessage(m) {
      if (m.dir === 'in') return getAgentLang();
      return getCustomerLang();
    }

    function renderTranslationBlock(m, targetLang) {
      if (!m.translation) return '';
      return '<div class="msg-trans-block">' +
        '<span class="msg-trans-label">译文 · ' + escapeHtml(api.langLabel(m.translationLang || targetLang)) + '</span>' +
        escapeHtml(m.translation) + '</div>';
    }

    function renderOutboundExtra(m) {
      if (m.dir !== 'out' || !m.originalText || m.originalText === m.text) return '';
      return '<div class="msg-trans-block">' +
        '<span class="msg-trans-label">坐席原文 · ' + escapeHtml(api.langLabel(m.originalLang || getAgentLang())) + '</span>' +
        escapeHtml(m.originalText) + '</div>';
    }

    function messageBubbleHtml(m, idx) {
      const targetLang = translationTargetForMessage(m);
      const showTranslateBtn = !m.translation || m.translationLang !== targetLang;
      return '<div class="msg ' + m.dir + '" data-msg-idx="' + idx + '">' +
        '<div class="msg-avatar">' + (m.dir === 'out' ? '我' : '客') + '</div>' +
        '<div class="msg-body">' +
        '<div class="msg-meta">' + escapeHtml(m.time) +
        (m.lang ? ' · ' + escapeHtml(api.langLabel(m.lang)) : '') + '</div>' +
        '<div class="msg-bubble">' + escapeHtml(m.text) +
        renderTranslationBlock(m, targetLang) +
        renderOutboundExtra(m) +
        '</div>' +
        '<div class="msg-actions">' +
        (showTranslateBtn ? '<button type="button" class="msg-tr-btn" data-translate-idx="' + idx + '">🌐 翻译</button>' : '') +
        (m.dir === 'in' ? '<button type="button" class="msg-tr-btn" data-quote-idx="' + idx + '">引用</button>' : '') +
        '</div></div></div>';
    }

    async function translateMessageAt(session, idx, force) {
      const m = session.messages[idx];
      if (!m) return;
      const targetLang = translationTargetForMessage(m);
      const sourceLang = m.lang || api.detectLang(m.text);
      if (!force && m.translation && m.translationLang === targetLang) return;
      if (sourceLang === targetLang) {
        m.translation = m.text;
        m.translationLang = targetLang;
        return;
      }
      const res = await api.translate(m.text, sourceLang, targetLang);
      logApi('POST /translate (mock)', { text: m.text, sourceLang, targetLang }, res);
      m.lang = sourceLang;
      m.translation = res.text;
      m.translationLang = targetLang;
    }

    async function autoTranslateIncomingMessages(session) {
      if (!isAutoTranslateIn()) return;
      const agentLang = getAgentLang();
      for (let i = 0; i < (session.messages || []).length; i += 1) {
        const m = session.messages[i];
        if (m.dir !== 'in') continue;
        const src = m.lang || api.detectLang(m.text);
        if (src === agentLang && m.translation) continue;
        await translateMessageAt(session, i, false);
      }
    }

    function bindMessageEvents(session) {
      const box = document.getElementById('chatMessages');
      box.querySelectorAll('.msg.in').forEach((el) => {
        el.oncontextmenu = (e) => {
          e.preventDefault();
          const idx = +el.dataset.msgIdx;
          msgMenuTarget = session.messages[idx];
          msgMenuTarget._idx = idx;
          showMsgMenu(e.clientX, e.clientY);
        };
      });
      box.querySelectorAll('[data-translate-idx]').forEach((btn) => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const idx = +btn.dataset.translateIdx;
          await translateMessageAt(session, idx, true);
          renderMessages(session);
        };
      });
      box.querySelectorAll('[data-quote-idx]').forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const idx = +btn.dataset.quoteIdx;
          const m = session.messages[idx];
          const quote = m.translation && isAutoTranslateIn() ? m.translation : m.text;
          insertToInput(quote);
        };
      });
    }

    function renderMessages(session) {
      const box = document.getElementById('chatMessages');
      box.innerHTML = (session.messages || []).map((m, idx) => messageBubbleHtml(m, idx)).join('');
      box.scrollTop = box.scrollHeight;
      bindMessageEvents(session);
    }

    async function updateComposePreview() {
      const ta = document.getElementById('agentInput');
      const previewEl = document.getElementById('composePreview');
      const previewTextEl = document.getElementById('composePreviewText');
      const previewLangEl = document.getElementById('previewLangLabel');
      const text = ta.value.trim();
      const agentLang = getAgentLang();
      const customerLang = getCustomerLang();

      if (!text || !isAutoTranslateOut() || agentLang === customerLang) {
        previewEl.classList.add('is-empty');
        lastComposePreview = text;
        return;
      }

      const res = await api.translate(text, agentLang, customerLang);
      logApi('POST /translate compose (mock)', { text, sourceLang: agentLang, targetLang: customerLang }, res);
      lastComposePreview = res.text;
      previewLangEl.textContent = api.langLabel(customerLang);
      previewTextEl.textContent = res.text;
      previewEl.classList.remove('is-empty');
    }

    function scheduleComposePreview() {
      clearTimeout(composePreviewTimer);
      composePreviewTimer = setTimeout(updateComposePreview, 350);
    }

    function logApi(label, req, res) {
      const el = document.getElementById('apiLog');
      el.style.display = 'block';
      const line = '[' + new Date().toLocaleTimeString() + '] ' + label + '\n→ ' + JSON.stringify(req) + '\n← ' + JSON.stringify(res) + '\n\n';
      el.textContent = line + el.textContent.slice(0, 2500);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function switchCtxTab(name) {
      currentCtxTab = name;
      document.querySelectorAll('.ctx-tab').forEach((t) => t.classList.toggle('active', t.dataset.ctx === name));
      document.querySelectorAll('.ctx-pane').forEach((p) => p.classList.remove('active'));
      const paneMap = { customer: 'paneCustomer', workorder: 'paneWorkorder', materials: 'paneMaterials' };
      document.getElementById(paneMap[name]).classList.add('active');
      if (name === 'materials' && currentSession) searchMaterials(document.getElementById('matSearchInput').value);
      if (name === 'workorder' && currentSession) loadWorkOrders();
      if (name === 'customer' && currentSession) loadCustomerContext(currentSession);
    }

    let sessionsData = { active: [], hosted: [], pendingResume: [], queue: [], stats: {} };
    let agentCapacity = null;

    async function loadCapacity() {
      try {
        agentCapacity = await api.getAgentCapacity(AGENT_ID);
        document.getElementById('statMaxActive').textContent = agentCapacity.maxActive ?? '—';
        document.getElementById('statMaxHosted').textContent = agentCapacity.maxHosted ?? '—';
      } catch (e) {
        agentCapacity = null;
      }
    }

    function updateSuspendResumeButtons() {
      const suspendBtn = document.getElementById('suspendBtn');
      const resumeBtn = document.getElementById('resumeBtn');
      if (!currentSession) {
        suspendBtn.style.display = '';
        resumeBtn.style.display = 'none';
        suspendBtn.disabled = true;
        return;
      }
      const state = currentSession.serviceState;
      const bucket = currentSession.bucket || currentTab;
      if (bucket === 'active' || state === 1) {
        suspendBtn.style.display = '';
        resumeBtn.style.display = 'none';
        suspendBtn.disabled = false;
      } else if (bucket === 'hosted' || bucket === 'pendingResume' || state === 2 || state === 3) {
        suspendBtn.style.display = 'none';
        resumeBtn.style.display = '';
        resumeBtn.disabled = false;
      } else {
        suspendBtn.style.display = '';
        resumeBtn.style.display = 'none';
        suspendBtn.disabled = true;
      }
    }

    async function loadSessions() {
      const res = await api.getAgentSessions(AGENT_ID, DEVICE_TYPE, true);
      logApi('GET /agent/sessions', { agentId: AGENT_ID, includeUnread: true }, res);
      sessionsData = res;
      document.getElementById('statActive').textContent = res.stats.activeCount;
      document.getElementById('statHosted').textContent = res.stats.hostedCount || 0;
      document.getElementById('statQueue').textContent = res.stats.queueCount;
      document.getElementById('badgeActive').textContent = res.stats.activeCount;
      document.getElementById('badgeHosted').textContent = res.stats.hostedCount || 0;
      document.getElementById('badgePending').textContent = res.stats.pendingCount || 0;
      document.getElementById('badgeQueue').textContent = res.stats.queueCount;
      await loadCapacity();
      renderSessions();
      if (currentSession) {
        const all = []
          .concat(res.active || [])
          .concat(res.hosted || [])
          .concat(res.pendingResume || []);
        const found = all.find((s) => s.id === currentSession.id || s.ticketId === currentSession.ticketId);
        if (found) await openSession(found, false);
        else resetChatView();
      }
      updateSuspendResumeButtons();
    }

    function renderSessions() {
      const tabMap = {
        active: sessionsData.active,
        hosted: sessionsData.hosted,
        pendingResume: sessionsData.pendingResume,
        queue: sessionsData.queue,
      };
      const tabLabels = {
        active: '进行中',
        hosted: '托管',
        pendingResume: '待恢复',
        queue: '排队',
      };
      const list = tabMap[currentTab] || [];
      const el = document.getElementById('sessionItems');
      if (!list.length) {
        el.innerHTML = '<div style="padding:24px;text-align:center;color:#8c8c8c;font-size:13px;">暂无' + (tabLabels[currentTab] || '') + '会话</div>';
        return;
      }
      el.innerHTML = list.map((s, i) => {
        const name = s.customerName || s.customerId;
        const preview = s.preview || '—';
        const time = s.startTime || (s.waitSeconds != null ? '等待 ' + s.waitSeconds + 's' : '—');
        const skill = api.normalizeSkill(s.skill);
        const stateTag = s.serviceState ? api.serviceStateLabel(s.serviceState) : '';
        const unread = s.unreadCount > 0 ? '<span class="session-unread">' + (s.unreadCount > 99 ? '99+' : s.unreadCount) + '</span>' : '';
        const active = currentSession && (currentSession.id === s.id || currentSession.customerId === s.customerId);
        return '<div class="session-item' + (active ? ' active' : '') + '" data-idx="' + i + '">' +
          '<div class="session-item-head"><span class="session-item-name">' + escapeHtml(name) + unread + '</span>' +
          '<span class="session-item-time">' + escapeHtml(time) + '</span></div>' +
          '<div class="session-item-preview">' + escapeHtml(preview) + '</div>' +
          (stateTag ? '<span class="session-item-tag">' + escapeHtml(stateTag) + '</span> ' : '') +
          (skill ? '<span class="session-item-tag">' + escapeHtml(skill) + '</span>' : '') +
          '</div>';
      }).join('');
      el.querySelectorAll('.session-item').forEach((item) => {
        item.onclick = () => {
          const s = list[+item.dataset.idx];
          if (currentTab === 'queue') pickupQueueSession(s);
          else openSessionAsync(s, true);
        };
      });
    }

    async function pickupQueueSession(q) {
      try {
        const scopeId = q.sessionScopeId || q.sessionId || q.customerId;
        const res = await api.pickupFromQueue(scopeId, AGENT_ID);
        logApi('POST /agent/queue/pickup', { sessionScopeId: scopeId, agentId: AGENT_ID }, res);
        if (res && res.success === false) { alert(res.message || '接入失败'); return; }
        await loadSessions();
        currentTab = 'active';
        document.querySelectorAll('.session-tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === 'active'));
        renderSessions();
        if (res && res.session) openSessionAsync(res.session, true);
      } catch (e) {
        alert('接入失败: ' + e.message);
      }
    }

    function resetChatView() {
      currentSession = null;
      document.getElementById('emptyChat').classList.remove('is-hidden');
      document.getElementById('chatContent').classList.remove('is-open');
      document.getElementById('contextPanel').classList.remove('show');
      closeWoDrawer();
    }

    function showMsgMenu(x, y) {
      const menu = document.getElementById('msgContextMenu');
      menu.style.left = x + 'px';
      menu.style.top = y + 'px';
      menu.classList.add('show');
    }

    function hideMsgMenu() {
      document.getElementById('msgContextMenu').classList.remove('show');
      msgMenuTarget = null;
    }

    function statusBadgeClass(status) {
      if (status === 1) return 'processing';
      if (status === 2) return 'closed';
      if (status === 3) return 'transferred';
      return 'closed';
    }

    function flowItemClass(recordType) {
      if (recordType === 2 || recordType === 3) return 'type-transfer';
      if (recordType === 4) return 'type-close';
      return '';
    }

    function renderFlowTimelineItem(log) {
      let title = log.recordTypeLabel;
      if (log.recordType === 2 && log.fromAssigneeName) {
        title = '转接转入 · 自 ' + log.fromAssigneeName;
      } else if (log.recordType === 3 && log.toAssigneeName) {
        title = '转出 → ' + log.toAssigneeName;
      } else if (log.recordType === 1) {
        title = '首次接入 · ' + (log.assigneeName || '—');
      } else if (log.recordType === 4) {
        title = '关单 · ' + (log.assigneeName || '—');
      }
      const extra = [];
      if (log.satisfactionLabel) extra.push('满意度：' + log.satisfactionLabel);
      if (log.remark) extra.push(log.remark);
      return '<div class="flow-item ' + flowItemClass(log.recordType) + '">' +
        '<div class="flow-time">' + escapeHtml(log.time) + '</div>' +
        '<div class="flow-title">' + escapeHtml(title) + '</div>' +
        (extra.length ? '<div class="flow-desc">' + escapeHtml(extra.join(' · ')) + '</div>' : '') +
        '</div>';
    }

    function renderCurrentTicketCard(cur) {
      const el = document.getElementById('currentTicketCard');
      if (!cur) {
        el.className = 'consult-card';
        el.innerHTML = '<div class="empty-hint" style="padding:12px">无咨询单数据</div>';
        return;
      }
      el.className = 'consult-card status-' + (cur.status === 1 ? 'processing' : cur.status === 3 ? 'transferred' : 'closed');
      const chips = [];
      chips.push('<span class="meta-chip">' + escapeHtml(cur.channel) + '</span>');
      chips.push('<span class="meta-chip">' + escapeHtml(cur.skillLabel) + '</span>');
      if (cur.queueWaitSeconds > 0) chips.push('<span class="meta-chip">排队 ' + cur.queueWaitSeconds + 's</span>');
      if (cur.workOrderCount > 0) chips.push('<span class="meta-chip info">工单 ' + cur.workOrderCount + '</span>');
      if (cur.followUpPending) chips.push('<span class="meta-chip warn">待跟进</span>');
      if (cur.isRobot) chips.push('<span class="meta-chip">机器人接待</span>');
      el.innerHTML =
        '<div class="consult-card-head">' +
        '<strong>' + escapeHtml(cur.id) + '</strong>' +
        '<span class="status-badge ' + statusBadgeClass(cur.status) + '">' + escapeHtml(cur.statusLabel) + '</span></div>' +
        '<div>接待：<strong>' + escapeHtml(cur.assigneeName || '—') + '</strong></div>' +
        '<div style="margin-top:4px;color:var(--muted);font-size:12px">进线 ' + escapeHtml(cur.startTime) +
        (cur.endTime ? ' · 结束 ' + escapeHtml(cur.endTime) : '') + '</div>' +
        '<div style="margin-top:6px;font-size:12px">' + escapeHtml(cur.preview || '') + '</div>' +
        (cur.remark ? '<div style="margin-top:6px;font-size:12px;color:#ad6800">备注：' + escapeHtml(cur.remark) + '</div>' : '') +
        (cur.satisfactionLabel ? '<div style="margin-top:4px;font-size:12px">满意度：' + escapeHtml(cur.satisfactionLabel) + '</div>' : '') +
        '<div class="consult-meta">' + chips.join('') + '</div>';
    }

    function renderHistoryList(history) {
      const listEl = document.getElementById('historyList');
      document.getElementById('historyCount').textContent = '(' + history.length + ')';
      if (!history.length) {
        listEl.innerHTML = '<div class="empty-hint">暂无历史进线</div>';
        return;
      }
      listEl.innerHTML = history.map((h, i) => {
        const sub = h.startTime + ' · ' + h.skillLabel + ' · ' + h.channel + ' · ' + h.statusLabel +
          (h.workOrderCount ? ' · 工单' + h.workOrderCount : '') +
          (h.satisfactionLabel ? ' · ' + h.satisfactionLabel : '');
        const timelineHtml = (h.timeline || []).map(renderFlowTimelineItem).join('') ||
          '<div class="empty-hint" style="padding:8px">无流转明细</div>';
        return '<div class="history-item" data-history-idx="' + i + '">' +
          '<div class="history-item-head">' +
          '<div class="history-item-title"><span>' + escapeHtml(h.preview || h.id) + '</span>' +
          '<span class="status-badge ' + statusBadgeClass(h.status) + '" style="flex-shrink:0">' + escapeHtml(h.statusLabel) + '</span></div>' +
          '<div class="history-item-sub">' + escapeHtml(sub) + '</div>' +
          '<div class="history-expand-hint">点击查看转接与处理详情 ▾</div></div>' +
          '<div class="history-item-body">' +
          '<div style="margin-bottom:6px;font-weight:600">' + escapeHtml(h.id) +
          ' <a href="cs-tickets.html?id=' + encodeURIComponent(h.id) + '" style="font-size:11px;font-weight:normal">咨询单中心 ↗</a></div>' +
          (h.remark ? '<div style="margin-bottom:8px;color:var(--muted)">处理：' + escapeHtml(h.remark) + '</div>' : '') +
          timelineHtml + '</div></div>';
      }).join('');
      listEl.querySelectorAll('.history-item-head').forEach((head) => {
        head.onclick = () => head.parentElement.classList.toggle('expanded');
      });
    }

    async function loadCustomerContext(session) {
      if (!session) return;
      const ctx = await api.getCustomerContext(session.id, session.customerId);
      logApi('GET /consultation/.../customer-context (mock)', { ticketId: session.id, customerId: session.customerId }, ctx);
      renderCurrentTicketCard(ctx.current);
      const timelineEl = document.getElementById('currentTimeline');
      if (ctx.timeline && ctx.timeline.length) {
        timelineEl.innerHTML = ctx.timeline.map(renderFlowTimelineItem).join('');
      } else {
        timelineEl.innerHTML = '<div class="empty-hint" style="padding:8px">暂无流转记录</div>';
      }
      renderHistoryList(ctx.history || []);
    }

    async function loadWorkOrders() {
      if (!currentSession) return;
      const res = await api.listWorkOrders(currentSession.id, currentSession.customerId);
      logApi('GET /consultation/.../work-orders (mock)', { ticketId: currentSession.id }, res);
      const container = document.getElementById('woListContainer');
      const badge = document.getElementById('woCountBadge');
      const count = res.items.filter((w) => w.consultationTicketId === currentSession.id).length;
      if (count > 0) {
        badge.textContent = count;
        badge.style.display = 'inline';
      } else {
        badge.style.display = 'none';
      }
      if (!res.items.length) {
        container.innerHTML = '<div class="empty-hint">暂无关联工单</div>';
        return;
      }
      container.innerHTML = res.items.map((w) => {
        const isCurrent = w.consultationTicketId === currentSession.id;
        return '<div class="wo-card">' +
          '<div class="wo-card-head"><span class="wo-card-id">' + escapeHtml(w.id) + '</span>' +
          '<span class="wo-status' + (w.status === 'done' ? ' done' : '') + '">' + api.workOrderStatusLabel(w.status) + '</span></div>' +
          '<div>' + escapeHtml(w.title) + '</div>' +
          '<div class="wo-card-desc">' + api.workOrderTypeLabel(w.type) + ' · ' + escapeHtml(w.createdAt) +
          (isCurrent ? '' : ' · 其他咨询单') + '</div>' +
          (w.description ? '<div class="wo-card-desc">' + escapeHtml(w.description) + '</div>' : '') +
          '</div>';
      }).join('');
    }

    async function searchMaterials(keyword) {
      if (!currentSession) return;
      const res = await api.searchMaterials(keyword, currentSession.customerId, currentSession.id);
      logApi('GET /materials/search (mock)', { keyword, customerId: currentSession.customerId }, res);
      lastMaterialResults = res;
      const el = document.getElementById('matResults');
      let html = '';
      let ki = 0;
      if (res.knowledge && res.knowledge.length) {
        html += '<div class="mat-group"><div class="mat-group-title">📄 知识库 (' + res.knowledge.length + ')</div>';
        res.knowledge.forEach((k) => {
          const full = k.title + '：' + k.snippet;
          html += matItemHtml(k.title, k.snippet, 'k', ki++);
        });
        html += '</div>';
      }
      let oi = 0;
      if (res.orders && res.orders.length) {
        html += '<div class="mat-group"><div class="mat-group-title">📦 客户订单 (' + res.orders.length + ')</div>';
        res.orders.forEach((o) => {
          html += '<div class="mat-item"><div class="mat-item-title">' + escapeHtml(o.id) + ' · ' + escapeHtml(o.title) + '</div>' +
            '<div class="mat-item-snippet">状态：' + escapeHtml(o.status) + ' · ' + escapeHtml(o.amount) + '</div>' +
            '<div class="mat-item-actions">' +
            '<button class="mat-act" data-kind="o" data-idx="' + oi + '" data-mode="insert">插入</button>' +
            '<button class="mat-act primary" data-kind="o" data-idx="' + oi + '" data-mode="send">发送</button></div></div>';
          oi += 1;
        });
        html += '</div>';
      }
      let di = 0;
      if (res.docs && res.docs.length) {
        html += '<div class="mat-group"><div class="mat-group-title">📎 产品文档 (' + res.docs.length + ')</div>';
        res.docs.forEach((d) => {
          html += matItemHtml(d.title, d.snippet, 'd', di++);
        });
        html += '</div>';
      }
      el.innerHTML = html || '<div class="empty-hint">未找到相关资料</div>';
      el.querySelectorAll('.mat-act').forEach((btn) => {
        btn.onclick = () => handleMaterialAction(btn.dataset.kind, +btn.dataset.idx, btn.dataset.mode);
      });
    }

    function materialFullText(kind, idx, mode) {
      if (kind === 'k') {
        const k = lastMaterialResults.knowledge[idx];
        return k ? k.title + '：' + k.snippet : '';
      }
      if (kind === 'o') {
        const o = lastMaterialResults.orders[idx];
        if (!o) return '';
        return mode === 'send'
          ? '您的订单 ' + o.id + ' 当前状态为「' + o.status + '」。'
          : '订单 ' + o.id + ' 当前状态：' + o.status;
      }
      if (kind === 'd') {
        const d = lastMaterialResults.docs[idx];
        return d ? d.title + '：' + d.snippet : '';
      }
      return '';
    }

    function handleMaterialAction(kind, idx, mode) {
      const text = materialFullText(kind, idx, mode);
      if (!text) return;
      if (mode === 'send') sendMaterialText(text);
      else insertToInput(text);
    }

    function matItemHtml(title, snippet, kind, idx) {
      return '<div class="mat-item"><div class="mat-item-title">' + escapeHtml(title) + '</div>' +
        '<div class="mat-item-snippet">' + escapeHtml(snippet) + '</div>' +
        '<div class="mat-item-actions">' +
        '<button class="mat-act" data-kind="' + kind + '" data-idx="' + idx + '" data-mode="insert">插入</button>' +
        '<button class="mat-act primary" data-kind="' + kind + '" data-idx="' + idx + '" data-mode="send">发送</button></div></div>';
    }

    function insertToInput(text) {
      const ta = document.getElementById('agentInput');
      ta.value = ta.value ? ta.value + '\n' + text : text;
      ta.focus();
    }

    async function sendMaterialText(text) {
      if (!currentSession) return;
      document.getElementById('agentInput').value = text;
      await sendReply('default');
    }

    function openWoDrawer(prefillDesc) {
      if (!currentSession) return;
      quotedMessageText = prefillDesc || '';
      document.getElementById('woFormMeta').innerHTML =
        '咨询单：<strong>' + escapeHtml(currentSession.id) + '</strong><br>' +
        '客户：<strong>' + escapeHtml(currentSession.customerId) + '</strong><br>' +
        '会话：<code style="font-size:11px">' + escapeHtml(currentSession.sessionId) + '</code>';
      document.getElementById('woTitle').value = currentSession.preview ? currentSession.preview.slice(0, 40) : '';
      document.getElementById('woDesc').value = quotedMessageText;
      const skill = currentSession.skill || 'GENERAL';
      const typeEl = document.getElementById('woType');
      if ([...typeEl.options].some((o) => o.value === skill)) typeEl.value = skill;
      document.getElementById('woDrawerMask').classList.add('open');
    }

    function closeWoDrawer() {
      document.getElementById('woDrawerMask').classList.remove('open');
      quotedMessageText = '';
    }

    async function submitWorkOrder() {
      if (!currentSession) return;
      const body = {
        consultationTicketId: currentSession.id,
        customerId: currentSession.customerId,
        sessionId: currentSession.sessionId,
        type: document.getElementById('woType').value,
        title: document.getElementById('woTitle').value.trim(),
        description: document.getElementById('woDesc').value.trim(),
        priority: document.getElementById('woPriority').value,
      };
      if (!body.title) { alert('请填写工单标题'); return; }
      const res = await api.createWorkOrder(body);
      logApi('POST /work-orders (mock)', body, res);
      closeWoDrawer();
      switchCtxTab('workorder');
      await loadWorkOrders();
      const notify = '已为您创建跟进工单 ' + res.workOrder.id + '，我们会尽快处理。';
      await api.sendAgentMessage(currentSession.id, notify);
      logApi('IM 通知客户 (mock)', { text: notify }, { ok: true });
      await loadSessions();
      alert('工单创建成功：' + res.workOrder.id);
    }

    function openSession(s, logIm) {
      return openSessionAsync(s, logIm);
    }

    async function openSessionAsync(s, logIm) {
      if (!s) return;
      await api.hydrateSessionMessages(s, AGENT_ID, DEVICE_TYPE, 'agent');
      currentSession = s;
      document.getElementById('emptyChat').classList.add('is-hidden');
      document.getElementById('chatContent').classList.add('is-open');
      document.getElementById('contextPanel').classList.add('show');

      if (logIm) logApi('IM login cs_agent (mock)', api.buildImLoginMock(5, AGENT_ID), { ok: true });

      const custLang = api.normalizeLang(s.customerLocale || api.detectLang((s.messages || []).find((m) => m.dir === 'in')?.text) || 'zh');
      document.getElementById('customerLang').value = custLang;

      document.getElementById('chatTitle').textContent = s.customerName || s.customerId;
      document.getElementById('chatSub').textContent =
        (s.channel || 'WEB') + ' · ' + api.normalizeSkill(s.skill) + ' · ' + api.langLabel(custLang) +
        (s.serviceState ? ' · ' + api.serviceStateLabel(s.serviceState) : '') +
        (s.unreadCount > 0 ? ' · 未读 ' + s.unreadCount : '');
      document.getElementById('cId').textContent = s.customerId;
      document.getElementById('cLocale').textContent = api.langLabel(custLang);
      document.getElementById('cChannel').textContent = s.channel || '—';
      document.getElementById('cSkill').textContent = api.normalizeSkill(s.skill);
      document.getElementById('cSession').textContent = s.sessionId || '—';
      const ticketLink = document.getElementById('viewTicketLink');
      if (ticketLink) ticketLink.href = 'cs-tickets.html?id=' + encodeURIComponent(s.id);

      await autoTranslateIncomingMessages(s);
      renderMessages(s);
      renderSessions();
      await Promise.all([loadCustomerContext(s), loadWorkOrders(), searchMaterials('')]);
      document.getElementById('agentInput').value = '';
      document.getElementById('composePreview').classList.add('is-empty');
      lastComposePreview = '';
      updateSuspendResumeButtons();
    }

    document.querySelectorAll('.session-tab').forEach((tab) => {
      tab.onclick = () => {
        document.querySelectorAll('.session-tab').forEach((t) => t.classList.remove('active'));
        tab.classList.add('active');
        currentTab = tab.dataset.tab;
        resetChatView();
        renderSessions();
      };
    });

    document.querySelectorAll('.ctx-tab').forEach((tab) => {
      tab.onclick = () => switchCtxTab(tab.dataset.ctx);
    });

    document.querySelectorAll('.status-btn[data-status]').forEach((btn) => {
      btn.onclick = async () => {
        await api.setAgentStatus(AGENT_ID, btn.dataset.status);
        document.querySelectorAll('.status-btn[data-status]').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
      };
    });

    document.getElementById('toolSearchBtn').onclick = () => { switchCtxTab('materials'); document.getElementById('matSearchInput').focus(); };
    document.getElementById('toolCreateWoBtn').onclick = () => openWoDrawer();
    document.getElementById('toolWoListBtn').onclick = () => switchCtxTab('workorder');
    document.getElementById('paneCreateWoBtn').onclick = () => openWoDrawer();
    document.getElementById('woDrawerClose').onclick = closeWoDrawer;
    document.getElementById('woCancelBtn').onclick = closeWoDrawer;
    document.getElementById('woSubmitBtn').onclick = submitWorkOrder;
    document.getElementById('woDrawerMask').onclick = (e) => { if (e.target.id === 'woDrawerMask') closeWoDrawer(); };

    document.getElementById('matSearchBtn').onclick = () => searchMaterials(document.getElementById('matSearchInput').value.trim());
    document.getElementById('matSearchInput').onkeydown = (e) => { if (e.key === 'Enter') searchMaterials(e.target.value.trim()); };

    document.getElementById('msgContextMenu').querySelectorAll('button').forEach((btn) => {
      btn.onclick = () => {
        if (!msgMenuTarget) return;
        if (btn.dataset.action === 'quote-wo') {
          const src = msgMenuTarget.translation && isAutoTranslateIn() ? msgMenuTarget.translation : msgMenuTarget.text;
          openWoDrawer('【客户原话】' + src);
        } else if (btn.dataset.action === 'search-mat') {
          switchCtxTab('materials');
          const kw = (msgMenuTarget.translation && isAutoTranslateIn() ? msgMenuTarget.translation : msgMenuTarget.text).slice(0, 20);
          document.getElementById('matSearchInput').value = kw;
          searchMaterials(kw);
        } else if (btn.dataset.action === 'translate-msg') {
          const idx = msgMenuTarget._idx;
          if (currentSession && idx != null) {
            translateMessageAt(currentSession, idx, true).then(() => renderMessages(currentSession));
          }
        }
        hideMsgMenu();
      };
    });
    document.addEventListener('click', hideMsgMenu);

    async function sendReply(mode) {
      if (!currentSession) return;
      const ta = document.getElementById('agentInput');
      const text = ta.value.trim();
      if (!text) return;

      const agentLang = getAgentLang();
      const customerLang = getCustomerLang();
      const sendMode = mode || 'default';
      let payload;

      if (sendMode === 'original' || !isAutoTranslateOut() || agentLang === customerLang) {
        payload = { text, lang: agentLang };
      } else {
        let translated = lastComposePreview;
        if (!translated) {
          const res = await api.translate(text, agentLang, customerLang);
          translated = res.text;
        }
        payload = {
          text: translated,
          lang: customerLang,
          originalText: text,
          originalLang: agentLang,
        };
      }

      await api.sendAgentMessage(currentSession.id, payload);
      logApi('IM -17 send (mock)', api.buildCsMessageMock(AGENT_ID, currentSession.customerId, payload.text), payload);
      ta.value = '';
      lastComposePreview = '';
      document.getElementById('composePreview').classList.add('is-empty');
      await loadSessions();
    }

    document.getElementById('agentSendBtn').onclick = () => sendReply('default');
    document.getElementById('sendTranslatedBtn').onclick = () => sendReply('translated');
    document.getElementById('sendOriginalBtn').onclick = () => sendReply('original');
    document.getElementById('previewTranslateBtn').onclick = updateComposePreview;
    document.getElementById('agentInput').oninput = scheduleComposePreview;
    document.getElementById('agentInput').onkeydown = (e) => {
      if (e.key === 'Tab' && !e.shiftKey) {
        if (tryQuickReplyShortcut()) { e.preventDefault(); return; }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply('default'); }
    };

    document.getElementById('quickReplyBtn').onclick = (e) => {
      e.stopPropagation();
      document.getElementById('qrPicker').classList.toggle('open');
    };
    document.addEventListener('click', () => {
      document.getElementById('qrPicker').classList.remove('open');
    });
    document.getElementById('qrPicker').onclick = (e) => e.stopPropagation();

    ['agentLang', 'customerLang', 'autoTranslateIn', 'autoTranslateOut'].forEach((id) => {
      const el = document.getElementById(id);
      el.addEventListener('change', async () => {
        saveLangPrefs();
        if (currentSession) {
          if (id === 'autoTranslateIn' || id === 'agentLang') {
            await autoTranslateIncomingMessages(currentSession);
            renderMessages(currentSession);
          }
          if (id === 'customerLang' || id === 'autoTranslateOut' || id === 'agentLang') {
            scheduleComposePreview();
          }
          if (id === 'customerLang') {
            document.getElementById('cLocale').textContent = api.langLabel(getCustomerLang());
            currentSession.customerLocale = getCustomerLang();
          }
        }
      });
    });

    document.getElementById('closeSessionBtn').onclick = async () => {
      if (!currentSession || !confirm('确认结束会话？')) return;
      const ticketId = currentSession.ticketId || currentSession.id;
      await api.closeConsultation(ticketId);
      resetChatView();
      await loadSessions();
    };

    document.getElementById('suspendBtn').onclick = async () => {
      if (!currentSession) return;
      const ticketId = currentSession.ticketId || currentSession.id;
      if (!confirm('挂起后释放进行中槽位，访客消息可触发恢复。确认挂起？')) return;
      await api.suspendConsultation(ticketId, '坐席手动挂起');
      resetChatView();
      await loadSessions();
    };

    document.getElementById('resumeBtn').onclick = async () => {
      if (!currentSession) return;
      const ticketId = currentSession.ticketId || currentSession.id;
      await api.resumeConsultation(ticketId);
      resetChatView();
      await loadSessions();
    };

    document.getElementById('refreshBtn').onclick = loadSessions;
    document.getElementById('logToggle').onclick = () => {
      const el = document.getElementById('apiLog');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

    (async function init() {
      if (!api.isSignedIn(AGENT_ID)) {
        window.location.replace('cs-lobby.html');
        return;
      }
      loadLangPrefs();
      await loadProfilePrefs();
      await loadQuickRepliesForWorkbench();
      const agent = api.getAgentInfo(AGENT_ID);
      document.getElementById('agentInfo').textContent = agent.agentName + ' · ' + agent.jobNo + ' · ' + AGENT_ID;
      logApi('工作台初始化 IM (mock)', api.buildImLoginMock(5, AGENT_ID), { signedIn: api.getSignedInSession() });
      await loadSessions();
      setInterval(loadSessions, 8000);
    })();

    document.getElementById('backLobbyBtn').onclick = async () => {
      if (!confirm('签出并返回大厅？进行中的会话请在结束接待后再签出。')) return;
      await api.signOut(AGENT_ID);
      logApi('返回大厅 signOut', { agentId: AGENT_ID }, { ok: true });
      window.location.href = 'cs-lobby.html';
    };
  </script>
</body>
