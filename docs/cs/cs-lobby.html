<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客服坐席大厅 · Mock</title>
  <link rel="icon" href="data:image/ico;base64,aWNv" />
  <style>
    :root {
      --primary: #1677ff;
      --success: #52c41a;
      --warning: #faad14;
      --danger: #ff4d4f;
      --bg: #f0f2f5;
      --border: #e8e8e8;
      --text: #262626;
      --muted: #8c8c8c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
      background: var(--bg); min-height: 100vh; color: var(--text);
    }

    .header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px; display: flex; align-items: center; gap: 16px;
    }
    .logo { font-weight: 700; font-size: 18px; color: var(--primary); }
    .mock-badge { background: #fef3c7; color: #92400e; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .header-spacer { flex: 1; }
    .header-link { font-size: 13px; color: var(--muted); text-decoration: none; padding: 6px 10px; border-radius: 6px; }
    .header-link:hover { color: var(--primary); background: #f5f5f5; }

    .page { max-width: 1100px; margin: 0 auto; padding: 24px; }

    .welcome {
      background: linear-gradient(135deg, #1677ff 0%, #0958d9 100%);
      color: #fff; border-radius: 16px; padding: 28px 32px; margin-bottom: 24px;
      display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
    }
    .welcome-avatar {
      width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,.2);
      display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0;
    }
    .welcome-text h1 { font-size: 22px; margin-bottom: 6px; }
    .welcome-text p { opacity: .88; font-size: 14px; line-height: 1.6; }
    .skill-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .skill-tag {
      font-size: 11px; padding: 2px 10px; border-radius: 12px;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3);
    }
    .status-pill {
      margin-left: auto; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,.15); display: flex; align-items: center; gap: 8px;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #bfbfbf; }
    .status-dot.online { background: #95de64; }
    .status-dot.away { background: #ffd666; }

    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px; margin-bottom: 24px;
    }
    .stat-card {
      background: #fff; border-radius: 12px; padding: 20px; border: 1px solid var(--border);
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .stat-card.highlight { border-color: #91caff; background: #f0f7ff; }
    .stat-label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-value small { font-size: 14px; font-weight: 500; color: var(--muted); }
    .stat-card.highlight .stat-value { color: var(--primary); }

    .actions {
      background: #fff; border-radius: 12px; padding: 24px; border: 1px solid var(--border);
      margin-bottom: 24px; text-align: center;
    }
    .actions p { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    .btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 600;
      cursor: pointer; border: none; transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(22,119,255,.35); }
    .btn-primary:hover:not(:disabled) { background: #0958d9; }
    .btn-secondary { background: #fff; color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .panels { grid-template-columns: 1fr; } }

    .panel {
      background: #fff; border-radius: 12px; border: 1px solid var(--border); overflow: hidden;
    }
    .panel-head {
      padding: 14px 18px; border-bottom: 1px solid var(--border);
      font-weight: 600; font-size: 14px;
    }
    .panel-body { padding: 12px 18px 16px; }

    .recent-item {
      padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px;
    }
    .recent-item:last-child { border-bottom: none; }
    .recent-title { font-weight: 500; margin-bottom: 4px; }
    .recent-sub { font-size: 12px; color: var(--muted); }
    .tag {
      display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 4px;
      background: #e6f4ff; color: var(--primary); margin-left: 6px;
    }
    .tag.closed { background: #f5f5f5; color: var(--muted); }

    .announce-item { padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
    .announce-item:last-child { border-bottom: none; }
    .announce-time { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .api-log {
      position: fixed; left: 16px; bottom: 16px; width: 360px; max-height: 120px;
      overflow-y: auto; background: #111827; color: #93c5fd; padding: 10px;
      border-radius: 8px; font-family: ui-monospace, monospace; font-size: 10px;
      line-height: 1.5; z-index: 100; display: none;
    }
    .api-log-toggle {
      position: fixed; left: 16px; bottom: 16px; z-index: 101;
      padding: 6px 10px; font-size: 11px; border-radius: 6px;
      border: 1px solid var(--border); background: #fff; cursor: pointer;
    }

    .footer-links {
      margin-top: 24px; text-align: center; font-size: 12px; color: var(--muted);
    }
    .footer-links a { color: var(--primary); margin: 0 8px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">偶遇云 · 坐席大厅</div>
    <span class="mock-badge">MOCK API</span>
    <div class="header-spacer"></div>
    <nav class="header-nav" style="display:flex;gap:4px;align-items:center">
      <a class="header-link" href="cs-tickets.html">咨询单</a>
      <a class="header-link" href="cs-admin-settings.html">系统配置</a>
      <a class="header-link" href="cs-profile.html">个人设置</a>
      <a class="header-link" href="cs-visitor.html" target="_blank">访客端 ↗</a>
    </nav>
  </header>

  <main class="page">
    <section class="welcome" id="welcomeSection">
      <div class="welcome-avatar">👤</div>
      <div class="welcome-text">
        <h1 id="welcomeTitle">—</h1>
        <p id="welcomeSub">签入后即可进入工作台接待进线客户</p>
        <div class="skill-tags" id="skillTags"></div>
      </div>
      <div class="status-pill" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">离线</span>
      </div>
    </section>

    <section class="stats-grid" id="statsGrid">
      <div class="stat-card"><div class="stat-label">今日接待</div><div class="stat-value" id="statToday">—</div></div>
      <div class="stat-card highlight"><div class="stat-label">排队中</div><div class="stat-value" id="statQueue">—</div></div>
      <div class="stat-card"><div class="stat-label">进行中</div><div class="stat-value" id="statActive">—</div></div>
      <div class="stat-card"><div class="stat-label">今日满意度</div><div class="stat-value" id="statSat">—<small> / 5</small></div></div>
      <div class="stat-card"><div class="stat-label">在线时长</div><div class="stat-value" id="statOnline" style="font-size:22px">—</div></div>
      <div class="stat-card"><div class="stat-label">今日工单</div><div class="stat-value" id="statWo">—</div></div>
      <div class="stat-card"><div class="stat-label">平均首响</div><div class="stat-value" id="statFr" style="font-size:22px">—</div></div>
    </section>

    <section class="actions">
      <p id="actionHint">当前未签入，签入后将连接 IM 并开始分配进线客户。</p>
      <div class="btn-row">
        <button class="btn btn-primary" id="signInBtn">签入并开始接待</button>
        <button class="btn btn-secondary" id="enterWorkbenchBtn" style="display:none">进入工作台</button>
        <button class="btn btn-secondary" id="signOutBtn" style="display:none">签出</button>
      </div>
    </section>

    <section class="panels">
      <div class="panel">
        <div class="panel-head">最近接待摘要</div>
        <div class="panel-body" id="recentList"><div style="color:var(--muted);font-size:13px">加载中…</div></div>
      </div>
      <div class="panel">
        <div class="panel-head">系统公告</div>
        <div class="panel-body" id="announceList"><div style="color:var(--muted);font-size:13px">加载中…</div></div>
      </div>
    </section>

    <div class="footer-links">
      静态原型：
      <a href="cs-lobby.html">大厅</a>
      <a href="cs-agent.html">工作台</a>
      <a href="cs-tickets.html">咨询单</a>
      <a href="cs-admin-settings.html">系统配置</a>
      <a href="cs-profile.html">个人设置</a>
      <a href="cs-visitor.html">访客 Widget</a>
    </div>
  </main>

  <button class="api-log-toggle" id="logToggle">API 日志</button>
  <div class="api-log" id="apiLog"></div>

  <script src="mock-api.js"></script>
  <script>
    const api = window.CsMockApi;
    const AGENT_ID = 'agent-001';

    function logApi(label, req, res) {
      const el = document.getElementById('apiLog');
      el.style.display = 'block';
      const line = '[' + new Date().toLocaleTimeString() + '] ' + label + '\n→ ' + JSON.stringify(req) + '\n← ' + JSON.stringify(res) + '\n\n';
      el.textContent = line + el.textContent.slice(0, 2000);
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function updateActionButtons(signedIn) {
      document.getElementById('signInBtn').style.display = signedIn ? 'none' : 'inline-block';
      document.getElementById('enterWorkbenchBtn').style.display = signedIn ? 'inline-block' : 'none';
      document.getElementById('signOutBtn').style.display = signedIn ? 'inline-block' : 'none';
      document.getElementById('actionHint').textContent = signedIn
        ? '您已签入，可进入工作台接待客户，或在此签出返回离线。'
        : '当前未签入，签入后将连接 IM（scope=5）并开始分配进线客户。';
    }

    function renderDashboard(data) {
      const a = data.agent;
      const s = data.stats;
      document.getElementById('welcomeTitle').textContent = a.agentName + ' · ' + a.jobNo;
      document.getElementById('welcomeSub').textContent = '工号 ' + a.agentId + ' · 今日请保持在线以便系统分配进线';
      document.getElementById('skillTags').innerHTML = (a.skillsLabel || []).map(function (sk) {
        return '<span class="skill-tag">' + escapeHtml(sk) + '</span>';
      }).join('');

      const signedIn = api.isSignedIn(AGENT_ID);
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot ' + (signedIn ? (a.status === 'away' ? 'away' : 'online') : '');
      document.getElementById('statusText').textContent = signedIn ? a.statusLabel : '离线';

      document.getElementById('statToday').textContent = s.todayServed;
      document.getElementById('statQueue').textContent = s.queueCount;
      document.getElementById('statActive').textContent = s.activeCount;
      document.getElementById('statSat').innerHTML = s.satisfactionAvg + '<small> / 5</small>';
      document.getElementById('statOnline').textContent = s.onlineDurationLabel;
      document.getElementById('statWo').textContent = s.workOrderCountToday;
      document.getElementById('statFr').textContent = s.avgFirstResponseLabel;

      document.getElementById('recentList').innerHTML = (data.recentSessions || []).map(function (r) {
        const cls = r.status === '已关闭' ? 'tag closed' : 'tag';
        return '<div class="recent-item"><div class="recent-title">' + escapeHtml(r.customerName) +
          '<span class="' + cls + '">' + escapeHtml(r.status) + '</span></div>' +
          '<div class="recent-sub">' + escapeHtml(r.time) + ' · ' + escapeHtml(r.preview) + '</div></div>';
      }).join('') || '<div style="color:var(--muted);font-size:13px">暂无记录</div>';

      document.getElementById('announceList').innerHTML = (data.announcements || []).map(function (n) {
        return '<div class="announce-item"><div>' + escapeHtml(n.title) + '</div>' +
          '<div class="announce-time">' + escapeHtml(n.time) + '</div></div>';
      }).join('') || '<div style="color:var(--muted);font-size:13px">暂无公告</div>';

      updateActionButtons(signedIn);
    }

    async function loadDashboard() {
      const data = await api.getAgentDashboard(AGENT_ID);
      logApi('GET /agent/dashboard (mock)', { agentId: AGENT_ID }, data);
      renderDashboard(data);
    }

    function goWorkbench() {
      window.location.href = 'cs-agent.html';
    }

    document.getElementById('signInBtn').onclick = async function () {
      const btn = this;
      btn.disabled = true;
      try {
        const res = await api.signIn(AGENT_ID);
        logApi('签入 POST /agent/online', { agentId: AGENT_ID }, res);
        logApi('IM login 准备 (mock)', api.buildImLoginMock(5, AGENT_ID), { ok: true });
        goWorkbench();
      } catch (e) {
        alert('签入失败: ' + e.message);
        btn.disabled = false;
      }
    };

    document.getElementById('enterWorkbenchBtn').onclick = goWorkbench;
    document.getElementById('signOutBtn').onclick = async function () {
      await api.signOut(AGENT_ID);
      logApi('签出 POST /agent/offline', { agentId: AGENT_ID }, { ok: true });
      await loadDashboard();
    };

    document.getElementById('logToggle').onclick = function () {
      const el = document.getElementById('apiLog');
      el.style.display = el.style.display === 'none' ? 'block' : 'none';
    };

    (async function init() {
      await loadDashboard();
      if (api.isSignedIn(AGENT_ID)) {
        document.getElementById('actionHint').textContent = '您已签入，可直接进入工作台，或在此签出。';
      }
      setInterval(loadDashboard, 15000);
    })();
  </script>
</body>
</html>
