syntax = "proto3";
package com.ouyunc.base.packet.message;
option optimize_for  = SPEED;
/**
 * @Author fangzhenxun
 * @Description: message 消息实体
 **/
message Message {
  string id = 1;
  //发送方
  string from = 2;
  //发送方类型
  int32 from_type = 3;
  //接受方
  string to = 4;
  //接收方类型
  int32 to_type = 5;
   //内容类型，根据不同的内容类型，可以序列化不同的json,如登录，聊天，信令服务，等
  int32 content_type = 6;
  //具体内容
  string content = 7;
  // @ 用户登录所绑定的唯一标识列表
  repeated string at = 8;
  // 引用消息id 集合
  repeated string ref = 9;
  // 扩展字段,自定义不做解析不做扩展
  string extra = 10;
  /**
     * 消息可靠性标识。服务端只接受 0 和 1。
     * QoS 0：至多一次。发送方不关心对端是否收到。
     * QoS 1：有限次至少一次。始发节点按配置重试，收到 ACK 后停止；进程退出不恢复定时器。
     * 客户端按消息标识去重，断线后按会话游标补拉。查询失败必须保留游标。
     * QoS 2（确保一次）当前未实现，不要按 exactly-once 理解本字段。
     */
  uint32 qos = 11;
  //时间戳,毫秒
  uint64 create_time = 12;

  // 关联ID,非必须
  string correlation_id = 13;
  // 14 为服务端内部 metadata，不向客户端公开。
  reserved 14;
}
