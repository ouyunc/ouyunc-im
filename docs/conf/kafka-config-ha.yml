# Kafka高可用部署说明
# 1. 需要部署至少6个Kafka节点（推荐奇数个节点）
# 2. 每个节点需要不同的broker.id
# 3. 需要配置Zookeeper集群或KRaft模式
# 4. 必须配置多副本（replication-factor >= 3）
# 5. 建议配置多分区（partitions >= 6）
# 6. 配置监控和告警系统
# 7. 配置备份和恢复策略
# 8. 配置安全认证和授权

# 高可用集群节点配置示例
# 节点1: kafka-ha-node1:9092 (broker.id=1, rack=rack1)
# 节点2: kafka-ha-node2:9092 (broker.id=2, rack=rack1)
# 节点3: kafka-ha-node3:9092 (broker.id=3, rack=rack2)
# 节点4: kafka-ha-node4:9092 (broker.id=4, rack=rack2)
# 节点5: kafka-ha-node5:9092 (broker.id=5, rack=rack3)
# 节点6: kafka-ha-node6:9092 (broker.id=6, rack=rack3)

# 主题配置示例
# 创建高可用主题：
# kafka-topics.sh --create --topic ouyunc-message-topic \
#   --bootstrap-server kafka-ha-node1:9092 \
#   --partitions 12 \
#   --replication-factor 3 \
#   --config min.insync.replicas=2 \
#   --config unclean.leader.election.enable=false \
#   --config compression.type=lz4 \
#   --config retention.ms=604800000 \
#   --config segment.ms=3600000 \
#   --config cleanup.policy=delete
