# Kafka 高可用配置文件
# 适用于生产环境，支持多副本、故障转移和高可用性

# 应用配置
ouyunc:
  # 消息队列配置
  mq:
    # Kafka 配置信息
    kafka:
      # 公共连接地址（高可用集群节点列表）
      bootstrapServers: 
        - kafka-ha-node1:9092
        - kafka-ha-node2:9092
        - kafka-ha-node3:9092
        - kafka-ha-node4:9092
        - kafka-ha-node5:9092
        - kafka-ha-node6:9092
      
      # 生产者配置（高可用优化）
      producer:
        # 生产者连接地址
        bootstrapServers: 
          - kafka-ha-node1:9092
          - kafka-ha-node2:9092
          - kafka-ha-node3:9092
          - kafka-ha-node4:9092
          - kafka-ha-node5:9092
          - kafka-ha-node6:9092
        # 消息确认应答模式（高可用必须使用all）
        ack: "all"
        # 批量发送的消息数量（字节）
        batchSize: 65536
        # 发送失败后的重复发送次数（高可用环境增加重试）
        retries: 10
        # 生产者缓冲区大小（字节）
        bufferMemory: 134217728
        # 批量发送延迟时间（毫秒）
        lingerMs: 10
        # 客户端ID
        clientId: "ouyunc-ha-producer"
        # 压缩类型（高可用环境建议使用lz4）
        compressionType: "lz4"
        # 消息key序列化器
        keySerializer: "org.apache.kafka.common.serialization.StringSerializer"
        # 消息value序列化器
        valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
        # 请求超时时间（毫秒）
        requestTimeoutMs: 60000
        # 重试退避时间（毫秒）
        retryBackoffMs: 200
        # 元数据最大年龄（毫秒）
        metadataMaxAgeMs: 600000
        # 分区器类
        partitionerClass: "org.apache.kafka.clients.producer.internals.DefaultPartitioner"
        # 拦截器类列表
        interceptorClasses: []
        # 幂等性（高可用环境必须启用）
        enableIdempotence: true
        # 事务ID（用于事务性消息）
        transactionalId: "ouyunc-ha-transactional-producer"
        # 事务超时时间（毫秒）
        transactionTimeoutMs: 300000
        # 最大阻塞时间（毫秒）
        maxBlockMs: 60000
        # 发送超时时间（毫秒）
        deliveryTimeoutMs: 120000
        # 启用幂等性的重试次数
        enableIdempotenceRetries: 5

