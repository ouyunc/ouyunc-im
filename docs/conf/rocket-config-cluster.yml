# 自建 RocketMQ 集群配置。当前阿里云实例不要用这份，用 rocket-config-aliyun.yml。

ouyunc:
  mq:
    rocket:
      # 公共 Name Server 地址（集群：多个节点，用分号或逗号隔开；客户端自动故障切换）
      nameServers:
        - rocketmq-ns1:9876
        - rocketmq-ns2:9876
        - rocketmq-ns3:9876

      # 生产者配置（集群环境推荐）
      producer:
        producerGroup: ouyunc-cluster-producer-group
        sendMsgTimeout: 5000
        compressMsgBodyOverHowmuch: 4096
        retryTimesWhenSendFailed: 3
        retryTimesWhenSendAsyncFailed: 3
        maxMessageSize: 4194304
        # 可选：生产者单独指定 Name Server
        # nameServers:
        #   - rocketmq-ns1:9876
        #   - rocketmq-ns2:9876
        #   - rocketmq-ns3:9876

      # 消费者配置（集群环境推荐）
      consumer:
        consumerGroup: ouyunc-cluster-consumer-group
        consumeThreadMin: 20
        consumeThreadMax: 128
        messageModel: CLUSTERING
        consumeFromWhere: CONSUME_FROM_LAST_OFFSET
        consumeMessageBatchMaxSize: 1
        # 可选：消费者单独指定 Name Server
        # nameServers:
        #   - rocketmq-ns1:9876
        #   - rocketmq-ns2:9876
        #   - rocketmq-ns3:9876

# 上面这份是以后自建 RocketMQ 集群用的，不要拿去替换当前阿里云实例 im-mq。
# 阿里云实例继续用 docs/conf/rocket-config-aliyun.yml 里的那一个 TCP 接入点。
# 多个 ouyunc-im 进程共用 GID_ouyunc_im_consumer，且 messageModel 为 CLUSTERING，消息在进程之间分摊。
# 规格不够时在控制台升配。换实例时把新的 TCP 接入点追加进 nameServers，vipChannelEnabled 保持 false。
#
# 自建集群：
# 1. Name Server 至少 2 个，地址都写进 nameServers，客户端用分号拼起来并自动故障切换
# 2. Broker 主从或 DLedger 多副本由 Name Server 发现，客户端不配 Broker 地址
# 3. 不填 accessKey，不把 vipChannelEnabled 设为 false
# 4. 合并到 ouyunc-server.yml 的 ouyunc.mq.rocket 下，并把 ouyunc.mq.type 改为 rocket
