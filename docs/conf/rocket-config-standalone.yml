# RocketMQ 单节点配置文件
# 与 Kafka 配置风格一致，适用于开发环境

ouyunc:
  mq:
    rocket:
      # 公共 Name Server 地址，多个用逗号或分号隔开
      nameServers:
        - 127.0.0.1:9876

      # 生产者配置
      producer:
        producerGroup: ouyunc-producer-group
        sendMsgTimeout: 3000
        compressMsgBodyOverHowmuch: 4096
        retryTimesWhenSendFailed: 2
        retryTimesWhenSendAsyncFailed: 2
        maxMessageSize: 4194304
        # 可选：覆盖全局 nameServers
        # nameServers:
        #   - 127.0.0.1:9876

      # 消费者配置（用于 RocketConsumerBuilder 构建 DefaultMQPushConsumer）
      consumer:
        consumerGroup: ouyunc-consumer-group
        consumeThreadMin: 20
        consumeThreadMax: 64
        messageModel: CLUSTERING
        consumeFromWhere: CONSUME_FROM_LAST_OFFSET
        consumeMessageBatchMaxSize: 1
        # 可选：覆盖全局 nameServers
        # nameServers:
        #   - 127.0.0.1:9876
