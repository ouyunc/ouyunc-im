# Kafka 集群配置文件
# 适用于生产环境，支持高可用和水平扩展

# 应用配置
ouyunc:
  # 消息队列配置
  mq:
    # Kafka 配置信息
    kafka:
      # 公共连接地址（集群节点列表）
      bootstrapServers: 
        - kafka-node1:9092
        - kafka-node2:9092
        - kafka-node3:9092
        - kafka-node4:9092
        - kafka-node5:9092
      
      # 生产者配置
      producer:
        # 生产者连接地址（集群节点列表）
        bootstrapServers: 
          - kafka-node1:9092
          - kafka-node2:9092
          - kafka-node3:9092
          - kafka-node4:9092
          - kafka-node5:9092
        # 消息确认应答模式（集群环境建议使用all）
        ack: "all"
        # 批量发送的消息数量（字节）
        batchSize: 32768
        # 发送失败后的重复发送次数
        retries: 5
        # 生产者缓冲区大小（字节）
        bufferMemory: 67108864
        # 批量发送延迟时间（毫秒）
        lingerMs: 5
        # 客户端ID
        clientId: "ouyunc-cluster-producer"
        # 压缩类型（集群环境建议使用lz4或snappy）
        compressionType: "lz4"
        # 消息key序列化器
        keySerializer: "org.apache.kafka.common.serialization.StringSerializer"
        # 消息value序列化器
        valueSerializer: "org.apache.kafka.common.serialization.StringSerializer"
        # 请求超时时间（毫秒）
        requestTimeoutMs: 30000
        # 重试退避时间（毫秒）
        retryBackoffMs: 100
        # 元数据最大年龄（毫秒）
        metadataMaxAgeMs: 300000
        # 分区器类
        partitionerClass: "org.apache.kafka.clients.producer.internals.DefaultPartitioner"
        # 拦截器类列表
        interceptorClasses: []
        # 幂等性
        enableIdempotence: true
        # 事务ID（用于事务性消息）
        transactionalId: null
        # 事务超时时间（毫秒）
        transactionTimeoutMs: 60000
