# Kafka集群部署说明
# 1. 需要部署至少3个Kafka节点（推荐5个节点）
# 2. 每个节点需要不同的broker.id
# 3. 需要配置Zookeeper集群或KRaft模式
# 4. 建议配置多副本（replication-factor >= 3）
# 5. 建议配置多分区（partitions >= 3）
# 6. 配置监控和告警系统

# 集群节点配置示例
# 节点1: kafka-node1:9092 (broker.id=1)
# 节点2: kafka-node2:9092 (broker.id=2)
# 节点3: kafka-node3:9092 (broker.id=3)
# 节点4: kafka-node4:9092 (broker.id=4)
# 节点5: kafka-node5:9092 (broker.id=5)
