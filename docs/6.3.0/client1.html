<script src="./ouyunc-protobuf-message.js"></script>
<script type="module">
import Socket from './ouyunc-message-sdk.js';
// 默认配置文件，可以进行覆盖
let defaultConfig = {
        clientType: 1, // 1-web, 2-uniapp
        Message: null, // protobuf Message 对象
        deviceType: 0,
        networkType: 0,
        encryptType: 0,
        serializeAlgorithm: 6, // 6-protobuf, 2-json
        heartbeat: {
            enable: true,
            maxWait: 3,
            interval: 10000,
            timeout: 5000
        },
        reconnect: {
            enable: true,
            maxTimes: -1,
            delay: 2000
        }
    };
var url = 'ws://172.18.62.195:6003/ws'
var local = 'ws://192.168.0.106:6003/ws'
const socket = new Socket(url, {
    clientType: 1,
    // 2-json序列化，6-protocolbuf 序列化，需要引入两个protobuf文件，且 属性 Message: proto.com.ouyunc.base.packet.message.Message,需要配置
	serializeAlgorithm: 6,
    deviceType: 1,
	Message: proto.com.ouyunc.base.packet.message.Message,
    heartbeat: {
        enable: true,
        interval: 5000
    }
});
socket.onopen = (e) => {
	let packet = socket.send({
            // 登录消息类型，
            messageType: -2,
            // 消息
            message: {
                // 消息发送方唯一标识，建议使用用户id
                from: '18888888888',
                // 消息接收方唯一标识，这里是登录，接受者是服务器，值可以为空串
                to: '',
                // 消息内容类型
                contentType: -2,
                // 消息内容content 是string 类型
                content: JSON.stringify({
                    identity: '18888888888',
                    appKey: 'ouyunc',
                    signatureAlgorithm: 1,//md5
                    signature: '123456',
                    createTime: new Date().getTime()
                }),
                createTime: new Date().getTime()
            }
        });
	console.log(packet)
};
socket.onmessage = ({
                        messageId,
                        messageType,
                        message
                    }) => {
    console.log('messageId:', messageId);
	console.log('messageType:', messageType);
	console.log('message:', message);
    if (messageType === -6) {
        document.getElementById('responseMessage').value = document.getElementById('responseMessage').value + "\n" + message.content;
    }
    if (messageType === -7) {
        //document.getElementById('sendMessage').value = document.getElementById('sendMessage').value + "\n" +message.content;
    }
    if (messageType === -128) {
        let packet = socket.send({
            // 登录消息类型，
            messageType: -9,
            // 消息
            message: {
                // 消息发送方唯一标识，建议使用用户id
                from: '18888888888',
                // 消息接收方唯一标识，这里是登录，接受者是服务器，值可以为空串
                to: '16666666666',
                // 消息内容类型
                contentType: -128,
                at: ['18888888888','16666666666'],
                ref: ['123','456'],
                qos: 1,
                // 消息内容content 是string 类型9223372036854775807
                //content: JSON.stringify(['304471782521737216','304471826142498816']),
                content: '我是18888888888，已经同意去添加好友，请知悉',
                extra: '我是额外信息',
                createTime: new Date().getTime()
            }
        });
    }

    console.log('发送私聊')
};















</script>
