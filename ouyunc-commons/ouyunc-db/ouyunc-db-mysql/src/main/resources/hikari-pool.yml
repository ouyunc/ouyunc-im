jdbc:
  # 数据库连接基本信息
  driverClassName: com.mysql.cj.jdbc.Driver
  url: jdbc:mysql://localhost:3306/your_database?useUnicode
  username: your_username
  password: your_password
hikari:
  # 连接池基本配置
  poolName: HikariPool-1
  maximumPoolSize: 10
  minimumIdle: 5
  # 连接时间相关配置
  connectionTimeout: 30000
  idleTimeout: 600000
  maxLifetime: 1800000
  keepaliveTime: 30000
  validationTimeout: 5000
  # 连接池运行配置
  autoCommit: true
  initializationFailTimeout: 1
  isolateInternalQueries: false
  allowPoolSuspension: false
  readOnly: false
  registerMbeans: false
  # 连接检测配置
  connectionTestQuery: SELECT 1
  leakDetectionThreshold: 60000
  dataSource:
    # MySQL性能优化配置
    cachePrepStmts: true
    prepStmtCacheSize: 250
    prepStmtCacheSqlLimit: 2048
    useServerPrepStmts: true
    useLocalSessionState: true
    rewriteBatchedStatements: true
    cacheResultSetMetadata: true
    cacheServerConfiguration: true
    elideSetAutoCommits: true
    maintainTimeStats: false
    # 网络配置
    socketTimeout: 30000
    connectTimeout: 10000



# 主要配置参数说明：
#连接池大小配置
#maximumPoolSize: 连接池最大连接数
#minimumIdle: 最小空闲连接数
#超时配置
#connectionTimeout: 连接超时时间
#idleTimeout: 空闲连接超时时间
#maxLifetime: 连接最大生命周期
#validationTimeout: 连接验证超时时间
#keepaliveTime: 心跳检测时间
#性能优化配置
#预编译语句缓存
#批处理优化
#服务器端预编译
#元数据缓存
#连接检测配置
#connectionTestQuery: 连接测试查询
#leakDetectionThreshold: 连接泄露检测
#事务相关
#autoCommit: 自动提交设置
#isolateInternalQueries: 内部查询隔离
#监控相关
#registerMbeans: JMX监控注册
#使用建议：
#maximumPoolSize 建议设置为 CPU核心数 2 + 1
#minimumIdle 建议设置与 maximumPoolSize 相同
#connectionTimeout 建议不要超过30秒
#maxLifetime 要比数据库的 wait_timeout 小几分钟
#对于高并发系统，建议开启所有性能优化选项