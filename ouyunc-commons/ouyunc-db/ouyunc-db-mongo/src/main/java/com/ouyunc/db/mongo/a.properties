# ==== 基本连接配置 ====
mongodb.uri=mongodb://username:password@localhost:27017,localhost:27018/database?replicaSet=rs0&authSource=admin

# ==== 连接池配置 ====
mongodb.pool.maxSize=100
mongodb.pool.minSize=10
mongodb.pool.maxWaitTime=5000
mongodb.pool.maxLifeTime=1800000
mongodb.pool.maxIdleTime=600000

# ==== 套接字配置 ====
mongodb.socket.connectTimeout=10000
mongodb.socket.readTimeout=15000

# ==== SSL配置 ====
mongodb.ssl.enabled=false
mongodb.ssl.invalidHostAllowed=false

# ==== 写入关注配置 ====
mongodb.writeConcern.w=majority
mongodb.writeConcern.journal=true
mongodb.writeConcern.wtimeout=1000

# ==== 读取首选项配置 ====
mongodb.readPreference=primaryPreferred

# ==== 读取关注配置 ====
mongodb.readConcern=majority

# ==== 压缩配置 ====
mongodb.compression.enabled=true
mongodb.compression.types=zlib,snappy,zstd