# 在第一次 Logger 初始化前生效。全异步 Logger 走项目已有的 Disruptor 4，不占用 Netty 线程刷盘。
# 少核机器上禁止 YIELD/BUSYSPIN 空转，与业务环的 BLOCKING 策略一致。
Log4jContextSelector=org.apache.logging.log4j.core.async.AsyncLoggerContextSelector
AsyncLogger.WaitStrategy=BLOCK
# 必须是 2 的幂。默认在开启 ThreadLocal 时只有 4096，高 QPS 下会立刻打满。
AsyncLogger.RingBufferSize=65536
# 队列满时丢弃 INFO 及以下，WARN/ERROR/FATAL 改为调用线程同步写出，避免错误日志丢失。
log4j2.AsyncQueueFullPolicy=Discard
log4j2.DiscardThreshold=INFO
# 2.16 起默认已关闭消息查找，这里钉死，避免 ${} 被当成 JNDI 查找。
log4j2.formatMsgNoLookups=true
